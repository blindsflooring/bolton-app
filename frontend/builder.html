<!DOCTYPE html>
<!--
Builder Referral Portal, Phase 1 pilot (confirmed Aug 2026).

Deliberately a completely SEPARATE, self-contained static page — not
routed through index.html's SPA, no <script src="shared.js"> or any
other internal app file. This is the single most important design
decision in this file: the brief's own highest-risk requirement is
"never expose cost, margin, box price, markup %, labour rate, supplier
name, or any pricing breakdown" to whoever holds a builder's link, and
the surest way to guarantee that is for this page to have literally no
code path that could ever touch internal app state, auth tokens, or
other screens — only the two hand-picked public endpoints in main.py
(GET /builder/{slug}, POST /builder/{slug}/estimate, GET
/builder/{slug}/statement), which themselves hand-pick their own
response fields for the same reason (see that section's own header
comment in main.py).

URL format: builder.html?slug=deon-brits (a query param, not a path
segment like the brief's own illustrative "bolton.app/q/deon-brits" —
adapted deliberately: this frontend is a plain static site with no
server-side rewrite rules configured, and guessing at one for a pilot
feature risked a broken/misconfigured deploy for zero real benefit —
the slug itself is exactly as sharable either way, just in the query
string instead of the path).

No login, no password — access control for this pilot is the link
itself plus Builder.active (revocation), confirmed directly in the
brief's own Section 1.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get a Vinyl Flooring Estimate</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f3ef; margin: 0; padding: 20px; color: #1a2b3c; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: #6b7280; font-size: 13px; }
  .card { background: white; border-radius: 10px; padding: 20px; margin-top: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; margin-top: 12px; }
  input, select { width: 100%; padding: 10px; border: 1px solid #d8d4cc; border-radius: 6px; font-size: 14px; font-family: inherit; }
  button { width: 100%; margin-top: 18px; padding: 12px; background: #1a2b3c; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  button.secondary { background: none; border: 2px solid #1a2b3c; color: #1a2b3c; margin-top: 8px; }
  .error { color: #c0392b; font-size: 13px; margin-top: 10px; }
  .result { background: #eef7f4; border: 2px solid #1a8a6e; border-radius: 8px; padding: 16px; margin-top: 16px; }
  .result .price-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
  .result .price-row.grand { font-weight: 800; font-size: 18px; color: #1a8a6e; border-top: 1px solid #cfe9e1; margin-top: 6px; padding-top: 10px; }
  .result .deposit { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #cfe9e1; font-weight: 700; }
  .nav { display: flex; gap: 8px; margin-top: 16px; }
  .nav a { flex: 1; text-align: center; padding: 8px; border: 2px solid #1a2b3c; border-radius: 6px; color: #1a2b3c; text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid #eee; }
  .status-earned { color: #1a8a6e; font-weight: 700; }
  .status-pending { color: #b8860b; }
  .status-estimate { color: #6b7280; }
  .action-row { display: flex; gap: 8px; margin-top: 10px; }
  .action-row button, .action-row a { flex: 1; margin-top: 0; padding: 10px; font-size: 13px; }
  .confirmed-badge { display: inline-block; background: #eef7f4; color: #1a8a6e; border: 1px solid #cfe9e1; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
  .row-actions { display: flex; gap: 6px; }
  .row-actions button { width: auto; margin: 0; padding: 4px 8px; font-size: 11px; }
  .letterhead-print { display: none; }
  @media print {
    body * { visibility: hidden; }
    .letterhead-print, .letterhead-print * { visibility: visible; }
    .letterhead-print { display: block; position: absolute; top: 0; left: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="app">
    <p class="muted">Loading...</p>
  </div>
</div>
<div id="printArea" class="letterhead-print"></div>

<script>
const API = 'https://bolton-backend.onrender.com';
const params = new URLSearchParams(window.location.search);
const slug = params.get('slug') || '';
let builderName = '';
let products = [];
// Screed + Trim On The Portal (confirmed Sept 2026) — everything the
// backend says this portal may ASK about. All of it is served by
// builder_portal_info() (main.py) rather than hardcoded here, so
// flagging a screed product or a reducer in the price book is what
// turns these questions on, with no frontend change.
let portalInfo = { screed_available: false, job_types: [], trim_available: false, trim_name: '', door_width_m: 0.9, stairwell_notice: '', builder_logo: '' };
let view = 'estimate';   // 'estimate' | 'statement' | 'commission'
// Potential Commission (confirmed Sept 2026, Burgert's own words: "I
// also need a tab to show the builder his potensial commision that will
// be paid to him"). Cached from the statement fetch — the two tabs read
// the SAME /builder/{slug}/statement response, so a builder can never
// see one figure on one tab and a different one on the other.
let statementData = null;
const MAX_PHOTOS = 5;   // Quote Photo Attachments pilot (confirmed Aug 2026) — mirrors MAX_PHOTOS_PER_SUBMISSION in main.py; server-side is the real enforcement, this is just so a builder sees the limit before hitting it

async function init() {
  if (!slug) {
    document.getElementById('app').innerHTML = '<div class="card"><p class="error">No link provided. Check the URL you were given.</p></div>';
    return;
  }
  try {
    const res = await fetch(`${API}/builder/${encodeURIComponent(slug)}`);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      document.getElementById('app').innerHTML = `<div class="card"><p class="error">${body.detail || "This link isn't active."}</p></div>`;
      return;
    }
    const data = await res.json();
    builderName = data.builder_name;
    products = data.products;
    portalInfo = data;
    renderEstimateForm();
  } catch (e) {
    document.getElementById('app').innerHTML = '<div class="card"><p class="error">Could not reach the server — check your connection and reload.</p></div>';
  }
}

// The builder's own logo (confirmed Sept 2026, Burgert: "make it that
// the builder can load his own logo, that will get and keep them
// engaded"). Replaces the plain "Hi <name>" heading once they upload
// one, and sits alongside it — this is THEIR page, so their branding
// leads here, unlike the printed estimate, which stays on Blinds &
// Flooring Studio's letterhead with theirs as a secondary mark.
function renderHeader() {
  return `<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
    ${portalInfo.builder_logo ? `<img src="${portalInfo.builder_logo}" alt="" style="max-height:52px; max-width:180px; object-fit:contain;">` : ''}
    <h1 style="margin:0;">Hi ${builderName}</h1>
  </div>`;
}

function renderLogoCard() {
  return `<div class="card">
    <h3 style="margin-top:0;">Your logo</h3>
    <p class="muted" style="margin-top:0; font-size:13px;">Add your own logo and it appears at the top of this page and on every estimate you print for a client, next to ours.</p>
    ${portalInfo.builder_logo ? `<div style="margin-bottom:8px;"><img src="${portalInfo.builder_logo}" alt="" style="max-height:60px; max-width:220px; object-fit:contain;"></div>` : ''}
    <input type="file" id="builder_logo_file" accept="image/png,image/jpeg,image/svg+xml,image/webp" onchange="uploadBuilderLogo(event)">
    ${portalInfo.builder_logo ? '<button type="button" class="secondary" onclick="removeBuilderLogo()">Remove</button>' : ''}
    <p class="muted" style="font-size:12px; margin:6px 0 0;">PNG, JPG, SVG or WEBP, up to 512KB.</p>
    <div id="logoError" class="error"></div>
  </div>`;
}

async function uploadBuilderLogo(event) {
  const file = (event.target.files || [])[0];
  const errEl = document.getElementById('logoError');
  errEl.textContent = '';
  if (!file) return;
  const body = new FormData();
  body.append('file', file);
  try {
    const res = await fetch(`${API}/builder/${encodeURIComponent(slug)}/logo`, { method: 'POST', body });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { errEl.textContent = data.detail || 'Could not upload that image.'; return; }
    portalInfo.builder_logo = data.builder_logo;
    rerenderCurrentView();
  } catch (e) {
    errEl.textContent = 'Could not reach the server — try again.';
  }
}

async function removeBuilderLogo() {
  if (!confirm('Remove your logo?')) return;
  try {
    const res = await fetch(`${API}/builder/${encodeURIComponent(slug)}/logo`, { method: 'DELETE' });
    if (!res.ok) { document.getElementById('logoError').textContent = 'Could not remove it — try again.'; return; }
    portalInfo.builder_logo = '';
    rerenderCurrentView();
  } catch (e) {
    document.getElementById('logoError').textContent = 'Could not reach the server — try again.';
  }
}

// One place that knows how to redraw whichever tab is open — the logo
// appears on all three, so changing it has to refresh the current one
// whatever that is.
function rerenderCurrentView() {
  if (view === 'statement') renderStatement();
  else if (view === 'commission') renderCommission();
  else renderEstimateForm();
}

function renderNav() {
  return `<div class="nav">
    <a onclick="view='estimate'; renderEstimateForm();" style="${view==='estimate' ? 'background:#1a2b3c; color:white;' : ''}">New Estimate</a>
    <a onclick="view='statement'; renderStatement();" style="${view==='statement' ? 'background:#1a2b3c; color:white;' : ''}">My Statement</a>
    <a onclick="view='commission'; renderCommission();" style="${view==='commission' ? 'background:#1a2b3c; color:white;' : ''}">My Commission</a>
  </div>`;
}

// Stairs (confirmed Sept 2026, Burgert's own words: "We need to say on
// the builders portal that a stairwell we need to qte as a company").
// Shown on the form, the estimate result and the statement — a builder
// pricing a house with a staircase should hit this wherever they are,
// not only if they happened to read the form's intro paragraph. The
// wording itself comes from the backend, so it can never say one thing
// here and another on a printed estimate.
function stairwellNoticeHtml() {
  if (!portalInfo.stairwell_notice) return '';
  return `<div class="card" style="border-left:4px solid #b45309; background:#fffbeb;">
    <p style="margin:0; font-size:13px;"><b>Staircases</b> — ${portalInfo.stairwell_notice}</p>
  </div>`;
}

// Floor condition. Only rendered when Burgert has actually flagged a
// screed product to the portal (screed_available) — without one there
// is nothing to price the prep with, and asking the question anyway
// would imply prep was included when it wasn't.
function jobTypeFieldHtml() {
  if (!portalInfo.screed_available) return '';
  return `<label>What is the floor going onto?</label>
    <select id="job_type">${portalInfo.job_types.map(j => `<option value="${j.value}">${j.label}</option>`).join('')}</select>
    <p class="muted" style="margin:4px 0 0; font-size:12px;">Going over tiles, or onto a floor where tiles have been lifted, needs levelling first — we add that to the price automatically.</p>`;
}

// Reducer trim, counted in door openings rather than metres — a builder
// knows how many doorways the floor runs through; working out linear
// metres of profile is our job, not theirs.
function trimFieldHtml() {
  if (!portalInfo.trim_available) return '';
  return `<label>Door openings (optional)</label>
    <input id="door_openings" type="number" step="1" min="0" placeholder="e.g. 3">
    <p class="muted" style="margin:4px 0 0; font-size:12px;">How many doorways does this floor run through? We add a ${portalInfo.trim_name} at each one (${portalInfo.door_width_m}m per opening).</p>`;
}

function renderEstimateForm(resultHtml) {
  if (!products.length) {
    document.getElementById('app').innerHTML = `
      ${renderHeader()}
      <p class="muted">Get an instant vinyl flooring estimate for your client.</p>
      ${renderNav()}
      <div class="card"><p class="error">No products are currently available through this portal — contact Blinds &amp; Flooring Studio.</p></div>`;
    return;
  }
  document.getElementById('app').innerHTML = `
    ${renderHeader()}
    <p class="muted">Get an instant vinyl flooring estimate for your client. For anything beyond this — multiple rooms, carpets, blinds — come see us at the showroom.</p>
    ${renderNav()}
    ${stairwellNoticeHtml()}
    <div class="card">
      <label>Client name</label>
      <input id="client_name" placeholder="Client's name">
      <label>Client contact (phone or email)</label>
      <input id="client_contact" placeholder="Optional">
      <label>Site address</label>
      <input id="site_address" placeholder="Optional">
      <label>Area (m²)</label>
      <input id="area_m2" type="number" step="0.01" min="0" placeholder="e.g. 25">
      <label>Product</label>
      <select id="product_id">${products.map(p => `<option value="${p.id}">${p.product_name}${p.colour ? ' — ' + p.colour : ''}</option>`).join('')}</select>
      ${jobTypeFieldHtml()}
      ${trimFieldHtml()}
      <label>Site photos (optional, up to ${MAX_PHOTOS})</label>
      <input type="file" id="site_photos" accept="image/*" multiple>
      <button id="submitBtn" onclick="submitEstimate()">Get Estimate</button>
      <div id="formError" class="error"></div>
      ${resultHtml || ''}
    </div>`;
}

async function submitEstimate() {
  const btn = document.getElementById('submitBtn');
  const errEl = document.getElementById('formError');
  errEl.textContent = '';
  const clientName = document.getElementById('client_name').value.trim();
  const areaM2 = parseFloat(document.getElementById('area_m2').value);
  const productId = document.getElementById('product_id').value;
  // Both fields only exist when the backend said this portal offers
  // them — the fallbacks below are the exact pre-existing behaviour
  // (smooth floor, no trim), so nothing changes for a tenant that
  // hasn't flagged a screed product or a reducer.
  const jobTypeEl = document.getElementById('job_type');
  const openingsEl = document.getElementById('door_openings');
  const doorOpenings = openingsEl ? (parseInt(openingsEl.value, 10) || 0) : 0;
  const photoFiles = Array.from(document.getElementById('site_photos').files || []);
  if (!clientName) { errEl.textContent = 'Enter the client\'s name.'; return; }
  if (!areaM2 || areaM2 <= 0) { errEl.textContent = 'Enter a real area in m².'; return; }
  if (doorOpenings < 0) { errEl.textContent = 'Door openings can\'t be a negative number.'; return; }
  if (photoFiles.length > MAX_PHOTOS) { errEl.textContent = `Attach at most ${MAX_PHOTOS} photos.`; return; }
  btn.disabled = true;
  btn.textContent = 'Calculating...';
  try {
    const res = await fetch(`${API}/builder/${encodeURIComponent(slug)}/estimate`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        client_name: clientName,
        client_contact: document.getElementById('client_contact').value.trim(),
        site_address: document.getElementById('site_address').value.trim(),
        area_m2: areaM2, product_id: parseInt(productId, 10),
        job_type: jobTypeEl ? jobTypeEl.value : 'smooth',
        door_openings: doorOpenings,
      }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      errEl.textContent = body.detail || 'Could not calculate an estimate — try again.';
      btn.disabled = false;
      btn.textContent = 'Get Estimate';
      return;
    }
    const data = await res.json();

    // Quote Photo Attachments, Phase 1 pilot (confirmed Aug 2026) — a
    // separate call from the estimate submission itself, made only if
    // photos were actually attached, so the existing JSON estimate
    // contract didn't need to change to a multipart one. Best-effort:
    // a photo-upload failure doesn't undo the estimate that's already
    // been logged, it's just reported alongside the result.
    let photoNote = '';
    if (photoFiles.length) {
      const photoBody = new FormData();
      photoFiles.forEach(f => photoBody.append('files', f));
      try {
        const photoRes = await fetch(`${API}/builder/${encodeURIComponent(slug)}/estimate/${data.estimate_id}/photos`, {
          method: 'POST', body: photoBody,
        });
        photoNote = photoRes.ok
          ? `<p class="muted" style="margin-top:6px;">${photoFiles.length} photo${photoFiles.length !== 1 ? 's' : ''} attached ✓</p>`
          : `<p class="error" style="margin-top:6px;">Estimate saved, but the photos didn't upload — you can still show them on-site when Blinds &amp; Flooring Studio follows up.</p>`;
      } catch (e) {
        photoNote = `<p class="error" style="margin-top:6px;">Estimate saved, but the photos didn't upload — you can still show them on-site when Blinds &amp; Flooring Studio follows up.</p>`;
      }
    }

    // Ex VAT AND incl VAT both shown, prominently, alongside the deposit
    // payable (confirmed directly) — never a cost/margin/rate figure,
    // this response only ever contains the fields main.py's
    // submit_builder_estimate() hand-picked for it.
    const resultHtml = `
      <div class="result">
        <p style="margin:0 0 8px; font-weight:700;">Estimate for ${clientName}</p>
        ${(data.breakdown || []).map(b => `
          <div class="price-row"><span>${b.label}<br><span class="muted" style="font-size:11px;">${b.detail}</span></span><span>R${b.amount_ex_vat.toFixed(2)}</span></div>`).join('')}
        <div class="price-row"><span class="muted">Floor rate: ${data.area_m2} m² × R${data.price_per_m2_ex_vat.toFixed(2)}/m² (ex VAT)</span><span></span></div>
        <div class="price-row"><span>Total, ex VAT</span><span>R${data.total_ex_vat.toFixed(2)}</span></div>
        <div class="price-row grand"><span>Total, incl VAT</span><span>R${data.total_incl_vat.toFixed(2)}</span></div>
        <div class="deposit price-row"><span>Deposit payable (${(data.deposit_pct*100).toFixed(0)}%)</span><span>R${data.deposit_amount.toFixed(2)}</span></div>
      </div>
      ${photoNote}
      <div class="action-row">
        <button type="button" class="secondary" onclick="printEstimate(${data.estimate_id})">Print / Download</button>
        <button type="button" onclick="confirmOrder(${data.estimate_id}, this)">Continue with this order &rarr;</button>
      </div>
      <p class="muted" style="margin-top:10px;">This estimate has been logged. Press "Continue with this order" once your client is ready to proceed &mdash; Blinds &amp; Flooring Studio will take it from there.</p>
      ${data.stairwell_notice ? `<p class="muted" style="margin-top:6px; font-size:12px;"><b>Stairs are not in this price</b> &mdash; ${data.stairwell_notice}</p>` : ''}`;
    renderEstimateForm(resultHtml);
  } catch (e) {
    errEl.textContent = 'Could not reach the server — try again.';
    btn.disabled = false;
    btn.textContent = 'Get Estimate';
  }
}

async function renderStatement() {
  document.getElementById('app').innerHTML = `${renderHeader()}${renderNav()}<div class="card"><p class="muted">Loading...</p></div>`;
  try {
    const res = await fetch(`${API}/builder/${encodeURIComponent(slug)}/statement`);
    const data = await res.json();
    statementData = data;
    const statusClass = (s) => s.includes('earned') ? 'status-earned' : s.includes('awaiting') ? 'status-pending' : 'status-estimate';
    const rows = data.estimates.length ? data.estimates.map(e => `
      <tr>
        <td>${new Date(e.created_at).toLocaleDateString()}</td>
        <td>${e.client_name}</td>
        <td>${e.product_name}${(e.breakdown && e.breakdown.length > 1) ? '<br>' + e.breakdown.slice(1).map(b => `<span class="muted" style="font-size:11px;">+ ${b.label}</span>`).join('<br>') : ''}</td>
        <td>R${e.quoted_price_incl_vat.toFixed(2)}</td>
        <td class="${statusClass(e.status)}">${e.status}</td>
        <td>${e.commission ? 'R' + e.commission.toFixed(2) : '—'}</td>
        <td>
          <div class="row-actions">
            <button type="button" onclick="printEstimate(${e.id})">Print</button>
            ${e.confirmed_by_builder
              ? '<span class="confirmed-badge">Sent ✓</span>'
              : `<button type="button" onclick="confirmOrder(${e.id}, this)">Continue</button>`}
          </div>
        </td>
      </tr>`).join('') : '<tr><td colspan="7" class="muted">No estimates submitted yet.</td></tr>';
    document.getElementById('app').innerHTML = `
      ${renderHeader()}
      ${renderNav()}
      ${stairwellNoticeHtml()}
      <div class="card">
        <p style="margin:0;"><b>Total commission earned to date:</b> R${data.total_commission_earned.toFixed(2)} <span class="muted">(${(data.commission_pct*100).toFixed(0)}% of each job's ex-VAT total, once fully paid)</span></p>
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>Date</th><th>Client</th><th>Product</th><th>Quoted</th><th>Status</th><th>Commission</th><th>Actions</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
      ${renderLogoCard()}`;
  } catch (e) {
    document.getElementById('app').innerHTML = `${renderHeader()}${renderNav()}<div class="card"><p class="error">Could not reach the server — try again.</p></div>`;
  }
}

// Potential Commission (confirmed Sept 2026). Three deliberately
// separate sections, not one blended "potential" total — they are
// different promises and a builder should never read them as one pot of
// money. Earned = the job is done and paid for; In progress = it IS a
// real job, priced off the real quote, waiting only on the client's
// final payment; Coming up = still just an estimate, which the client
// may never go ahead with. The backend splits them the same way and for
// the same reason (see builder_statement(), main.py).
async function renderCommission() {
  document.getElementById('app').innerHTML = `${renderHeader()}${renderNav()}<div class="card"><p class="muted">Loading...</p></div>`;
  try {
    if (!statementData) {
      const res = await fetch(`${API}/builder/${encodeURIComponent(slug)}/statement`);
      statementData = await res.json();
    }
    const d = statementData;
    const rand = (n) => 'R' + (n || 0).toFixed(2);
    const dateStr = (iso) => iso ? new Date(iso).toLocaleDateString('en-ZA') : '';
    const earned = d.estimates.filter(e => e.commission);
    const inProgress = d.estimates.filter(e => e.potential_basis === 'in_progress');
    const pipeline = d.estimates.filter(e => e.potential_basis === 'pipeline');

    const section = (title, note, rows, amountOf, extraCell) => `
      <div class="card">
        <h3 style="margin-top:0;">${title}</h3>
        <p class="muted" style="margin-top:0; font-size:12px;">${note}</p>
        ${rows.length ? `<div style="overflow-x:auto;"><table>
          <thead><tr><th>Client</th><th>Job value</th><th>Commission</th>${extraCell ? '<th>Status</th>' : ''}</tr></thead>
          <tbody>${rows.map(e => `
            <tr>
              <td>${e.client_name}<br><span class="muted" style="font-size:11px;">${dateStr(e.created_at)}</span></td>
              <td>${rand(e.quoted_price_incl_vat)}<br><span class="muted" style="font-size:11px;">incl VAT</span></td>
              <td><b>${rand(amountOf(e))}</b></td>
              ${extraCell ? `<td>${extraCell(e)}</td>` : ''}
            </tr>`).join('')}</tbody>
        </table></div>` : '<p class="muted" style="margin:0;">Nothing here yet.</p>'}
      </div>`;

    document.getElementById('app').innerHTML = `
      ${renderHeader()}
      ${renderNav()}
      <div class="card">
        <p style="margin:0 0 8px;">You earn <b>${(d.commission_pct*100).toFixed(1)}%</b> of each job's value excluding VAT. It becomes yours once the client has paid Blinds &amp; Flooring Studio in full — not when the quote goes out.</p>
        <div class="price-row"><span>Earned so far</span><span><b>${rand(d.total_commission_earned)}</b></span></div>
        <div class="price-row"><span>&nbsp;&nbsp;of that, already paid to you</span><span>${rand(d.total_commission_paid_out)}</span></div>
        <div class="price-row"><span>&nbsp;&nbsp;still to be paid to you</span><span><b>${rand(d.total_commission_awaiting_payout)}</b></span></div>
        <div class="price-row" style="margin-top:8px;"><span>On jobs in progress</span><span>${rand(d.total_commission_in_progress)}</span></div>
        <div class="price-row"><span>On estimates not yet confirmed</span><span>${rand(d.total_commission_pipeline)}</span></div>
      </div>
      ${section('Earned', 'These jobs are finished and the client has paid in full — this commission is yours.', earned,
                e => e.commission,
                e => e.commission_paid
                  ? `<b style="color:#166534;">Paid to you ✓</b>${e.commission_paid_at ? `<br><span class="muted" style="font-size:11px;">${dateStr(e.commission_paid_at)}</span>` : ''}`
                  : '<b>Awaiting payout</b>')}
      ${section('In progress', 'Real jobs going ahead, priced off the actual quote. This commission is paid once the client settles their final payment.', inProgress, e => e.potential_commission, null)}
      ${section('Coming up', 'Estimates you have submitted that have not become jobs yet. This is what the commission would be if the client goes ahead — it is not owed to you yet, and the final quote can differ from the estimate.', pipeline, e => e.potential_commission, null)}
      <p class="muted" style="font-size:12px;">Questions about any of these? Give Blinds &amp; Flooring Studio a call.</p>`;
  } catch (e) {
    document.getElementById('app').innerHTML = `${renderHeader()}${renderNav()}<div class="card"><p class="error">Could not reach the server — try again.</p></div>`;
  }
}

async function printEstimate(estimateId) {
  try {
    const res = await fetch(`${API}/builder/${encodeURIComponent(slug)}/estimate/${estimateId}/print`);
    if (!res.ok) { alert('Could not load the print details — try again.'); return; }
    const d = await res.json();
    const dateStr = new Date(d.created_at).toLocaleDateString('en-ZA');
    const html = `
      <div style="font-family: 'Segoe UI', Arial, sans-serif; padding: 24px; color: #1a2b3c;">
        <div style="display:flex; justify-content:space-between; border-bottom: 2px solid #1a2b3c; padding-bottom: 12px; margin-bottom: 20px;">
          <div>
            <!-- Logo on builder documents (confirmed Sept 2026). A
            custom logo uploaded in Business Settings wins; otherwise
            the same default image the app's own header ships with,
            served as a sibling static file rather than a second copy of
            a 28KB base64 string pasted into this page. onerror hides
            the element outright, so a missing file can never leave a
            broken-image icon sitting on a document that goes to a
            client. -->
            <img src="${d.logo_base64 || 'logo.png'}" alt="" style="height:36px; display:block; margin-bottom:8px;" onerror="this.style.display='none';">
            ${d.business_name ? `<div style="font-size:16px; font-weight:800;">${d.business_name}</div>` : ''}
            <div style="font-size:11px; color:#6b7280; line-height:1.5;">
              ${d.address ? `${d.address}<br>` : ''}
              ${d.phone ? `Tel: ${d.phone}` : ''}${d.phone && d.email ? ' &middot; ' : ''}${d.email || ''}
              ${d.vat_number ? `<br>VAT: ${d.vat_number}` : ''}
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:18px; font-weight:800;">ESTIMATE</div>
            <div style="font-size:11px; color:#6b7280;">${dateStr}</div>
            <div style="font-size:11px; color:#6b7280;">Referred by: ${d.builder_name}</div>
            <!-- The builder's own logo: deliberately small and under
            "Referred by", never in place of our letterhead above. This
            document quotes a real price on Blinds & Flooring Studio's
            behalf, and a client reading it must not be left unsure
            whose quote it is. -->
            ${d.builder_logo ? `<img src="${d.builder_logo}" alt="" style="max-height:28px; max-width:120px; object-fit:contain; margin-top:6px;" onerror="this.style.display='none';">` : ''}
          </div>
        </div>
        <div style="margin-bottom:20px; font-size:13px;">
          <div><b>Quoted to:</b> ${d.client_name}</div>
          ${d.site_address ? `<div><b>Site:</b> ${d.site_address}</div>` : ''}
        </div>
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead><tr><th style="text-align:left; border-bottom:1px solid #ccc; padding:6px 4px;">Description</th><th style="text-align:right; border-bottom:1px solid #ccc; padding:6px 4px;">Area</th><th style="text-align:right; border-bottom:1px solid #ccc; padding:6px 4px;">Total (ex VAT)</th></tr></thead>
          <tbody>${(d.breakdown || []).map(b => `
            <tr>
              <td style="padding:6px 4px;">${b.label}<div style="font-size:10px; color:#6b7280;">${b.detail}</div></td>
              <td style="text-align:right; padding:6px 4px;">${d.area_m2} m²</td>
              <td style="text-align:right; padding:6px 4px;">R${b.amount_ex_vat.toFixed(2)}</td>
            </tr>`).join('')}</tbody>
        </table>
        <div style="margin-top:16px; font-size:13px;">
          <div style="display:flex; justify-content:space-between; padding:4px 0;"><span>VAT (${(d.vat_pct*100).toFixed(0)}%)</span><span>R${(d.quoted_price_incl_vat - d.quoted_price_ex_vat).toFixed(2)}</span></div>
          <div style="display:flex; justify-content:space-between; padding:4px 0; font-weight:800; font-size:15px; border-top:1px solid #1a2b3c; margin-top:4px; padding-top:8px;"><span>Total (incl VAT)</span><span>R${d.quoted_price_incl_vat.toFixed(2)}</span></div>
          <div style="display:flex; justify-content:space-between; padding:4px 0; margin-top:10px; padding-top:10px; border-top:1px dashed #ccc;"><span>Deposit (${(d.deposit_pct*100).toFixed(0)}%, due to start)</span><span>R${d.deposit_amount.toFixed(2)}</span></div>
        </div>
        ${d.bank_details ? `<div style="margin-top:20px; padding-top:14px; border-top:1px solid #ccc; font-size:11px; color:#6b7280;"><b>Banking details for deposit payment:</b><br>${d.bank_details.replace(/\n/g,'<br>')}</div>` : ''}
        <p style="margin-top:20px; font-size:11px; color:#6b7280;">This is an estimate, not a final invoice — subject to confirmation once ${d.business_name || 'we'} follow up on-site.</p>
        ${d.stairwell_notice ? `<p style="margin-top:6px; font-size:11px; color:#6b7280;"><b>Staircases are not included in this estimate.</b> ${d.stairwell_notice}</p>` : ''}
      </div>`;
    document.getElementById('printArea').innerHTML = html;
    window.print();
  } catch (e) {
    alert('Could not reach the server — try again.');
  }
}

let confirmingOrder = false;
async function confirmOrder(estimateId, btn) {
  if (confirmingOrder) return;
  confirmingOrder = true;
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Sending...';
  try {
    const res = await fetch(`${API}/builder/${encodeURIComponent(slug)}/estimate/${estimateId}/confirm`, { method: 'POST' });
    const body = await res.json().catch(() => ({}));
    confirmingOrder = false;
    if (!res.ok) {
      alert(body.detail || 'Could not send this through — try again.');
      btn.disabled = false;
      btn.textContent = originalText;
      return;
    }
    // My Statement is a table of several estimates at once — re-fetch so
    // this row's Status/Actions cells reflect the real, now-confirmed
    // server state (same "derive at read time" principle as everywhere
    // else this table's figures come from), rather than hand-patching
    // just the one cell. The New Estimate result screen only ever shows
    // ONE estimate at a time, so swapping the button in place is enough
    // there — no need to re-fetch or navigate the builder away from what
    // they were just looking at.
    // Confirming moves this estimate from "Coming up" to "In progress"
    // on the commission tab, so the cached statement is now stale.
    statementData = null;
    if (view === 'statement') {
      renderStatement();
    } else {
      btn.outerHTML = '<span class="confirmed-badge">Sent ✓</span>';
    }
  } catch (e) {
    alert('Could not reach the server — try again.');
    btn.disabled = false;
    btn.textContent = originalText;
    confirmingOrder = false;
  }
}

init();
